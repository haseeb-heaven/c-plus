# SonarCloud analysis scope for C+
#
# Test corpora deliberately contain unsafe C, duplicated scenarios and
# intentionally tainted inputs. They are safety fixtures, not production code:
# counting them as duplicated or insecure code would penalize the project for
# testing those exact patterns. Keep them out of the quality gate while still
# keeping them in the repository and in the compiler test suites.
sonar.projectKey=haseeb-heaven_c-plus
sonar.organization=haseeb-heaven

sonar.sources=compiler,runtime,tools
sonar.tests=tests,demos,benchmarks,examples
sonar.exclusions=**/__pycache__/**,build*/**,tests/out/**,demos/out/**,benchmarks/out/**
sonar.cpd.exclusions=tests/**,demos/**,benchmarks/**,examples/**
sonar.sourceEncoding=UTF-8
