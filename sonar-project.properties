# SonarCloud analysis scope for the c-plus-stdlib project.
#
# IMPORTANT: production sources are intentionally NOT excluded and remain fully
# analysed. In particular these paths stay in scope:
#   libc/src/**, libc/log/**, stdlib/safe/src/**, stdlib/safe/*.h
# No quality-gate threshold is lowered and no rule is disabled here. We only
# remove machine/template-generated test fixtures from analysis because they
# are intentionally repetitive test data, not hand-maintained production code.
# Counting them inflates duplication (CPD) and produces noisy, unactionable
# "security"/"reliability" findings on generated code.

sonar.projectKey=haseeb-heaven_c-plus
sonar.organization=haseeb-heaven
sonar.sources=.

# Keep third-party code, build output and git metadata out of analysis.
#
# The following families are GENERATED / adversarial test fixtures. They are
# excluded from ALL analysis (issues, security, reliability, duplication and
# coverage) rather than only from CPD, because they are not production code:
#
#   tests/crt/adversarial/test_*50*.c
#       Generated adversarial CRT fixtures with "50" in the case name
#       (alloc50/mem50/io50/str50/raii50/...). Highly repetitive by design.
#   tests/libc/test_corpus_*.c
#       Generated corpus drivers (buffer, format, integer, math, null,
#       overlap, resource, uaf, uninit, ...). One repeated harness template.
#   tests/scenarios/scenario_*.c
#       Generated large scenario fixtures (some hundreds of KB / 100k+ cases).
#   scratch/bugs*.cp
#       Generated bug-catalog scratch files (~50 files, ~500k lines total).
#   tests/compile_fail/bugcat*.c and tests/compile_fail/bugcat*.err
#       Generated negative-compilation ("bugcat") fixtures and expected
#       compiler diagnostics; .err are data, .c are throwaway templates.
sonar.exclusions=\
  third_party/**,\
  build/**,\
  **/.git/**,\
  tests/crt/adversarial/test_*50*.c,\
  tests/libc/test_corpus_*.c,\
  tests/scenarios/scenario_*.c,\
  scratch/bugs*.cp,\
  tests/compile_fail/bugcat*.c,\
  tests/compile_fail/bugcat*.err

# Defence in depth for duplication: the generated fixtures above are already
# removed from analysis by sonar.exclusions. Repeat the same generated-only
# patterns here so that, if the analysis scope is ever widened, these fixtures
# still cannot inflate the CPD duplication metric. No production path is listed.
sonar.cpd.exclusions=\
  tests/crt/adversarial/test_*50*.c,\
  tests/libc/test_corpus_*.c,\
  tests/scenarios/scenario_*.c,\
  scratch/bugs*.cp,\
  tests/compile_fail/bugcat*.c,\
  tests/compile_fail/bugcat*.err

sonar.cfamily.compile-commands=build/compile_commands.json
sonar.sourceEncoding=UTF-8
