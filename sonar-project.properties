# SonarCloud analysis scope for C+ — CI-based analysis (SonarScanner).
#
# This file is used ONLY when SonarCloud is configured for CI-based analysis.
# SonarCloud AUTOMATIC analysis ignores this file and reads .sonarcloud.properties
# from the default branch instead. Keep the two files consistent: any change to
# the analysis scope must be made in both places.
#
# Unlike .sonarcloud.properties, CI mode permits wildcard patterns; the explicit
# fixture paths below are kept identical in both files to prevent drift.
#
# Test corpora deliberately contain unsafe C, duplicated scenarios and
# intentionally tainted inputs. They are safety fixtures, not production code:
# counting them as duplicated or insecure code would penalize the project for
# testing those exact patterns. This is a measurement-scope correction, NOT a
# claim that production-source findings are fixed. See docs/SONAR_SCOPE.md.
sonar.projectKey=haseeb-heaven_c-plus
sonar.organization=haseeb-heaven

sonar.sources=compiler,runtime,tools
sonar.tests=tests,demos,benchmarks,examples

# Unsafe fixture directories, listed explicitly. sonar.exclusions covers source
# scope; sonar.test.exclusions covers files under sonar.tests (required because
# sonar.exclusions does not apply to test-classified files).
sonar.exclusions=**/__pycache__/**,build*/**,tests/out/**,demos/out/**,benchmarks/out/**,tests/safety,tests/metrics,tests/breaker,tests/cases,tests/compile_fail,tests/runtime_fail,tests/known_gaps,tests/legacy,tests/native,tests/core/quarantine,tests/stress
sonar.test.exclusions=tests/safety,tests/metrics,tests/breaker,tests/cases,tests/compile_fail,tests/runtime_fail,tests/known_gaps,tests/legacy,tests/native,tests/core/quarantine,tests/stress

# Duplication is disabled across all test/demo/benchmark/example trees,
# including the generated scenario scripts in tests/metrics.
sonar.cpd.exclusions=tests,demos,benchmarks,examples

sonar.sourceEncoding=UTF-8
