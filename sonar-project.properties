# SonarCloud configuration for the C+ repository.
#
# Vendor code is not ours to fix: excluding it keeps the new-code ratings
# meaningful.  Apply the same exclusions in the SonarCloud project settings if
# automatic analysis is used (the UI settings win over this file there).
sonar.projectKey=haseeb-heaven_c-plus
sonar.organization=haseeb-heaven
sonar.sources=compiler,runtime,stdlib,tests,tools,benchmarks,demos,examples
sonar.exclusions=third_party/**,build/**,tests/out/**,demos/out/**,examples/out/**,benchmarks/out/**,scratch/**,tests/**/.cplus-tmp-*.c
sonar.cpd.exclusions=third_party/**,stdlib/*.hp,compiler/**,tests/**
sonar.coverage.exclusions=third_party/**,tests/**,demos/**,examples/**,benchmarks/**
