# SonarQube Cloud — configuration for AUTOMATIC analysis.
#
# IMPORTANT: automatic analysis IGNORES sonar-project.properties. It reads this
# file from the repository's DEFAULT BRANCH only. Wildcard patterns are NOT
# allowed here (they are allowed in sonar-project.properties for CI analysis).
# Supported keys are listed in the SonarCloud "Automatic analysis" docs:
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/
#
# sonar.projectKey / sonar.organization are intentionally absent: automatic
# analysis is bound to the GitHub repository in the SonarCloud UI and does not
# support those keys in this file. They remain in sonar-project.properties.
#
# This is a MEASUREMENT-SCOPE correction, not a code-quality fix. The excluded
# directories are deliberate unsafe/bug/fuzz fixtures and generated corpus
# scripts that exist to TEST the compiler. They stay in the repository and in
# the test suites. Their intentional defects are not production bugs/vulns and
# their template-generated code is not production duplication.
# Full rationale: docs/SONAR_SCOPE.md

# Baseline for issue analysis is production code only.
sonar.sources=compiler,runtime,tools

# Test trees stay identified for test-code metrics, but the unsafe fixture
# directories are removed from issue analysis below. sonar.exclusions does NOT
# apply to files classified as test code, so sonar.test.exclusions is required.
sonar.tests=tests,demos,benchmarks,examples

# Explicit fixture directories (no wildcards). Keep this list identical to
# sonar.exclusions and to the list in sonar-project.properties.
sonar.test.exclusions=tests/safety,tests/metrics,tests/breaker,tests/cases,tests/compile_fail,tests/runtime_fail,tests/known_gaps,tests/legacy,tests/native,tests/core/quarantine,tests/stress
sonar.exclusions=tests/safety,tests/metrics,tests/breaker,tests/cases,tests/compile_fail,tests/runtime_fail,tests/known_gaps,tests/legacy,tests/native,tests/core/quarantine,tests/stress

# Duplication is disabled across all test/demo/benchmark/example trees. In
# particular tests/metrics holds the numbered generator scripts (100/260/350
# scenario families) that emit near-identical code and caused the ~25%
# duplication.
sonar.cpd.exclusions=tests,demos,benchmarks,examples

sonar.sourceEncoding=UTF-8
