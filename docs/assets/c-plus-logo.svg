    <path d="M440 425c-98 0-155 60-155 151s57 151 155 151c59 0 103-22 137-62l-55-55c-22 25-46 37-78 37-53 0-85-28-85-71s32-71 85-71c32 0 56 12 78 37l55-55c-34-40-78-62-137-62Z" fill="url(#silver)" stroke="url(#gold)" stroke-width="8"/>
    <path d="M700 470h72v82h82v72h-82v82h-72v-82h-82v-72h82Z" fill="url(#gold)" stroke="#f8e7b3" stroke-width="7"/>
    <path d="M165 735Q600 650 1035 735L985 855Q600 790 215 855Z" fill="url(#navy)" stroke="url(#gold)" stroke-width="10"/>
