<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">C+ — The safest next version C++ never shipped</title>
  <desc id="desc">A silver and gold shield containing a bold C+ emblem on a dark navy technical background, with the C+ slogan on a banner.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#14283b"/><stop offset="1" stop-color="#050b13"/></radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#b9c5d2"/><stop offset=".72" stop-color="#f8fbff"/><stop offset="1" stop-color="#718094"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0b9"/><stop offset=".45" stop-color="#caa65b"/><stop offset="1" stop-color="#80602d"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183d59"/><stop offset=".55" stop-color="#09233a"/><stop offset="1" stop-color="#061421"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#7c9ab0" opacity=".16"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="topArc" d="M 230 300 Q 600 20 970 300"/>
  </defs>
  <rect width="1200" height="1000" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="1000" rx="30" fill="url(#dots)"/>
  <g opacity=".5" stroke="#1abce0" fill="none" stroke-width="5">
    <path d="M70 480h150l45-42h95M1130 480H980l-45-42h-95M80 550h120l35 30h100M1120 550h-120l-35 30H865"/>
    <path d="M150 410v150m28-110v95m28-145v185M1022 400v160m28-110v95m28-145v185" stroke-dasharray="10 15"/>
  </g>
