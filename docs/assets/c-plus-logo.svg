  <path d="M190 320c88 83 202 106 330 72 76-20 139-57 194-111" fill="none" stroke="url(#blue)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <text x="450" y="468" text-anchor="middle" fill="#f4f7ff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">THE SAFEST NEXT VERSION</text>
  <text x="450" y="503" text-anchor="middle" fill="#21c7ff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">C++ NEVER SHIPPED</text>
</svg>