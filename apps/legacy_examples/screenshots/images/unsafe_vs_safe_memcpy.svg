<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="298" viewBox="0 0 1370 298">
  <style>
    .body { fill: #d0d7de; font-family: Consolas, Menlo, monospace; font-size: 14px; }
    .refused { fill: #7ee787; font-weight: 700; }
