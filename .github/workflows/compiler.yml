name: compiler

on:
  push:
    branches: [develop, agent/core-safety]
  pull_request:
    branches: [develop]

# Collapse the duplicate push + pull_request runs that fire when a branch with
# an open PR is pushed (e.g. agent/core-safety / PR #16). head_ref is set for
# pull_request and ref_name for push, so both resolve to the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos-arm64-cplus:
    # GitHub retired the macos-14 runner label on 2026-11-02; macos-15 is the
    # supported arm64 label. The old label caused jobs to cancel with 0 steps.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install llvm cmake ninja rust
      - name: Configure
        run: |
          PREFIX="$(brew --prefix llvm)"
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$PREFIX/lib/cmake/llvm" \
            -DClang_DIR="$PREFIX/lib/cmake/clang" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --target c+ --parallel
      - name: CTest (repo tests + demos)
        run: ctest --test-dir build --output-on-failure
      - name: Core safety suite
        run: CPLUS_BIN="$PWD/build/c+" sh tests/core/run.sh

  linux-x86-64-cplus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libclang-dev cmake \
                                  ninja-build python3 rustc \
                                  libprotobuf-dev protobuf-compiler-grpc \
                                  libgrpc++-dev libabsl-dev libzstd-dev
      - name: Configure
        run: |
          LLVM_VER="$(llvm-config --version | cut -d. -f1)"
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="/usr/lib/llvm-${LLVM_VER}/lib/cmake/llvm" \
            -DClang_DIR="/usr/lib/llvm-${LLVM_VER}/lib/cmake/clang" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --target c+ --parallel
      - name: CTest (repo tests + demos)
        run: ctest --test-dir build --output-on-failure
      - name: Core safety suite
        run: CPLUS_BIN="$PWD/build/c+" sh tests/core/run.sh
