name: libc-crt

on:
  push:
    branches: [develop, agent/modern-stdlib, agent/core-safety]
  pull_request:
    branches: [develop]

jobs:
  linux-crt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - name: Build safe CRT
        run: sh scripts/build_safecrt.sh
      - name: CRT unit tests
        run: sh tests/crt/unit/run_unit_tests.sh
      - name: CRT all checks
        run: sh tests/crt/run_all_crt.sh
      - name: Libc tests
        run: sh tests/libc/run_libc_tests.sh
      - name: Libc line coverage (>= 80% gate)
        run: |
          set -eu
          # Ubuntu ships versioned llvm-cov/llvm-profdata (e.g. llvm-cov-18).
          # The coverage script honours LLVM_COV/LLVM_PROFDATA overrides.
          COV=$(command -v llvm-cov || true)
          PROF=$(command -v llvm-profdata || true)
          if [ -z "$COV" ]; then
            COV=$(ls /usr/bin/llvm-cov-* 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$PROF" ]; then
            PROF=$(ls /usr/bin/llvm-profdata-* 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$COV" ] || [ -z "$PROF" ]; then
            echo "llvm-cov/llvm-profdata unavailable; cannot enforce coverage gate"
            exit 1
          fi
          LLVM_COV="$COV" LLVM_PROFDATA="$PROF" sh tests/libc/coverage_libc.sh
      - name: Adversarial attack suites
        run: sh tests/libc/run_attack_tests.sh
      - name: Bug-class corpora (thousands of cases)
        run: sh tests/libc/run_corpus_tests.sh
      - name: Per-method scenario suites (1000+ each, 10-30 runtime scenarios)
        run: sh tests/scenarios/run_scenarios.sh
      - name: Per-method unit and logging-parity suites
        run: sh tests/methods/run_methods.sh
      - name: Hundred-scenario per-method suites
        run: sh tests/methods/run_hundred.sh
      - name: C+/Rust safety conformance (12 gates)
        run: sh tests/conformance/run_conformance.sh
      - name: Rust-vs-C+ runtime outcomes (100 cases x 6 families)
        run: sh tests/rust_vs_cplus/run_compare.sh
      - name: Libc install smoke
        run: sh tests/libc/install_smoke.sh
      - name: C/C++ header compatibility matrix
        run: sh tests/compat/run_compat.sh
      - name: External SDK consumer (clean prefix, find_package)
        run: sh tests/sdk/run_sdk_consumer.sh
      - name: Fuzz smoke (UBSan)
        run: sh tests/crt/fuzz/run_fuzz_smoke.sh
      - name: CTL container tests
        run: sh tests/ctl/run_ctl_tests.sh
      - name: yyjson upstream tests
        run: sh tests/json/run_json_tests.sh
      - name: Exception tests
        run: sh tests/exceptions/run_except_tests.sh
      - name: Runtime recover & cleanup tests
        run: sh tests/runtime/run_runtime_tests.sh
      - name: Libc fuzz
        run: sh tests/libc/run_fuzz.sh
      - name: Combined fuzz harness
        run: |
          clang -O2 -Wall -Wextra -pedantic -std=c99 -pthread -Istdlib/safe -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/crt/fuzz/fuzz_all_safe_apis.c build/safe/libcplus_safecrt.a -o /tmp/fuzz_all
          /tmp/fuzz_all
      - name: Safety scenario matrix (C & threads)
        run: |
          set -eu
          sh tests/libc/build_libc.sh >/dev/null
          clang -O0 -g -Wall -Wextra -Werror -std=c99 -pthread -fsanitize=undefined,bounds,null,alignment -fsanitize-recover=all -fno-sanitize-trap=all -fno-omit-frame-pointer -Istdlib/safe -Ilibc -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/safety/test_scenarios_c.c stdlib/safe/src/safe_runtime.c build/safe/libcplus_safecrt.a build/libc/libcplus_hardened.a -o /tmp/test_scenarios_c
          /tmp/test_scenarios_c
          clang -O1 -g -Wall -Wextra -Werror -std=c99 -pthread -fsanitize=undefined -fno-sanitize-recover=all -Istdlib/safe -Ilibc tests/safety/test_scenarios_threads.c build/safe/libcplus_safecrt.a build/libc/libcplus_hardened.a -o /tmp/test_scenarios_threads
          /tmp/test_scenarios_threads
      - name: ASan+UBSan+TSan smoke
        run: |
          set -eu
          clang -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Istdlib/safe -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/crt/unit/test_memcpy_s.c build/safe/libcplus_safecrt.a -o /tmp/test_memcpy_asan
          /tmp/test_memcpy_asan
          clang -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Istdlib/safe -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/crt/unit/test_alloc_metadata_s.c build/safe/libcplus_safecrt.a -o /tmp/test_meta_asan
          /tmp/test_meta_asan
          clang -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Istdlib/safe -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/crt/unit/test_auto_bounds_s.c build/safe/libcplus_safecrt.a -o /tmp/test_auto_bounds_asan
          /tmp/test_auto_bounds_asan
          clang -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Istdlib/safe -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/crt/unit/test_bugs_catalogue_204.c build/safe/libcplus_safecrt.a -o /tmp/test_catalogue_asan
          /tmp/test_catalogue_asan
          clang -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Istdlib/safe -Ithird_party/safeclib/include -Ithird_party/intel-safestringlib/include tests/crt/fuzz/fuzz_all_safe_apis.c build/safe/libcplus_safecrt.a -o /tmp/fuzz_all_asan
          /tmp/fuzz_all_asan
          clang -O1 -g -pthread -fsanitize=thread -Istdlib/safe -Ilibc tests/safety/test_scenarios_threads.c build/safe/libcplus_safecrt.a build/libc/libcplus_hardened.a -o /tmp/test_threads_tsan
          /tmp/test_threads_tsan

  # Dedicated ASan allocator integration job. It rebuilds both libraries with
  # -fsanitize=address into build/asan, so ordinary release build outputs in
  # build/safe and build/libc are unaffected. No ASAN_OPTIONS suppressions are
  # used: ASan errors are intentionally allowed to fail the build.
  asan-libc-crt:
    runs-on: ubuntu-latest
    env:
      CPLUS_CLANG: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: ASan allocator integration (Linux)
        run: sh tests/crt/asan/run_asan.sh
