name: release-alpha

on:
  push:
    tags:
      - 'v*-alpha*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm cmake ninja
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm-dev libclang-dev cmake ninja-build
      - name: Configure and build
        shell: bash
        run: |
          set -eu
          cmake -S . -B build -G Ninja
          cmake --build build --parallel
      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p stage/bin stage/include stage/lib
          cp build/c+ stage/bin/
          cp -R runtime/include/cplus stage/include/
          cp -R libc/install-include/. stage/include/
          cp LICENSE stage/
          tar -czf "cplus-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: cplus-${{ matrix.target }}
          path: cplus-*.tar.gz

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "C+ $GITHUB_REF_NAME" --prerelease --generate-notes
